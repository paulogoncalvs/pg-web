
<!--?xml version="1.0" encoding="UTF-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"></stop>
      <stop offset="100%" stop-color="#0f172a"></stop>
    </linearGradient>

    <linearGradient id="bundleGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"></stop>
      <stop offset="100%" stop-color="#f97316"></stop>
    </linearGradient>

    <linearGradient id="chunkGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"></stop>
      <stop offset="100%" stop-color="#8b5cf6"></stop>
    </linearGradient>

    <filter id="blurGlow">
      <feGaussianBlur stdDeviation="12"></feGaussianBlur>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4"></feGaussianBlur>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"></rect>

  <!-- Grid -->
  <g opacity="0.05">
    <path d="M0 100H1200 M0 200H1200 M0 300H1200 M0 400H1200 M0 500H1200" stroke="white"></path>
    <path d="M100 0V630 M200 0V630 M300 0V630 M400 0V630 M500 0V630
             M600 0V630 M700 0V630 M800 0V630 M900 0V630
             M1000 0V630 M1100 0V630" stroke="white"></path>
  </g>

  <!-- LEFT SIDE: BIG BUNDLE -->

  <rect x="120" y="180" width="220" height="220" rx="24" fill="url(#bundleGlow)" opacity="0.2" filter="url(#blurGlow)"></rect>

  <rect x="120" y="180" width="220" height="220" rx="24" fill="#111827" stroke="#ef4444" stroke-width="3"></rect>

  <text x="230" y="260" fill="#f87171" text-anchor="middle" font-size="28" font-family="monospace">
    main.js
  </text>

  <text x="230" y="315" fill="white" text-anchor="middle" font-size="72" font-weight="700" font-family="Arial">
    109
  </text>

  <text x="230" y="350" fill="#94a3b8" text-anchor="middle" font-size="22" font-family="Arial">
    kB
  </text>

  <!-- Center Arrow -->

  <path d="M390 290 H760" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 12">

    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2s" repeatCount="indefinite"></animate>
  </path>

  <!-- Moving packet -->

  <circle r="8" fill="#38bdf8">
    <animateMotion dur="3s" repeatCount="indefinite" path="M390 290 H760"></animateMotion>
  </circle>

  <!-- RIGHT SIDE CHUNKS -->

  <g transform="translate(840 160)">
    <rect width="110" height="70" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2"></rect>

    <text x="55" y="43" fill="#38bdf8" text-anchor="middle" font-size="16">
      Home
    </text>

    <animateTransform attributeName="transform" type="translate" values="840 160;840 150;840 160" dur="4s" repeatCount="indefinite"></animateTransform>
  </g>

  <g transform="translate(980 180)">
    <rect width="110" height="70" rx="14" fill="#111827" stroke="#8b5cf6" stroke-width="2"></rect>

    <text x="55" y="43" fill="#c4b5fd" text-anchor="middle" font-size="16">
      Blog
    </text>
  </g>

  <g transform="translate(860 280)">
    <rect width="110" height="70" rx="14" fill="#111827" stroke="#22c55e" stroke-width="2"></rect>

    <text x="55" y="43" fill="#86efac" text-anchor="middle" font-size="16">
      MDX
    </text>
  </g>

  <g transform="translate(1010 320)">
    <rect width="110" height="70" rx="14" fill="#111827" stroke="#f59e0b" stroke-width="2"></rect>

    <text x="55" y="43" fill="#fcd34d" text-anchor="middle" font-size="16">
      i18n
    </text>
  </g>

  <g transform="translate(820 420)">
    <rect width="110" height="70" rx="14" fill="#111827" stroke="#ec4899" stroke-width="2"></rect>

    <text x="55" y="43" fill="#f9a8d4" text-anchor="middle" font-size="16">
      Utils
    </text>
  </g>

  <!-- Chunk connections -->

  <g opacity="0.35">
    <line x1="880" y1="260" x2="1035" y2="215" stroke="#38bdf8"></line>

    <line x1="880" y1="260" x2="915" y2="315" stroke="#38bdf8"></line>

    <line x1="915" y1="315" x2="1065" y2="355" stroke="#38bdf8"></line>

    <line x1="915" y1="315" x2="875" y2="455" stroke="#38bdf8"></line>
  </g>

  <!-- Performance badge -->

  <circle cx="600" cy="290" r="75" fill="#0f172a" stroke="#22c55e" stroke-width="3"></circle>

  <circle cx="600" cy="290" r="82" fill="none" stroke="#22c55e" opacity="0.25">

    <animate attributeName="r" values="82;96;82" dur="2.5s" repeatCount="indefinite"></animate>

    <animate attributeName="opacity" values="0.25;0;0.25" dur="2.5s" repeatCount="indefinite"></animate>
  </circle>

  <text x="600" y="275" fill="#22c55e" text-anchor="middle" font-size="20" font-family="Arial">
    ↓ 83%
  </text>

  <text x="600" y="312" fill="white" text-anchor="middle" font-size="16" font-family="Arial">
    Initial JS
  </text>

  <!-- Footer -->

  <text x="600" y="575" text-anchor="middle" fill="#94a3b8" font-size="24" font-family="Arial">
    Same HTML • Less JavaScript • Faster First Paint
  </text>

</svg>
