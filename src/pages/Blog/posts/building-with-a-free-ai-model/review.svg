<svg width="600" height="300" viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="300" rx="10" fill="#111827"/>

  <rect x="50" y="100" width="120" height="100" rx="8" fill="#1F2937" stroke="#10B981" stroke-width="2"/>
  <text x="110" y="155" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="20" font-weight="bold">AI</text>
  <text x="110" y="180" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="12">Generates Code</text>

  <path d="M170 150 H230" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="250,150 300,100 350,150 300,200" fill="#1F2937" stroke="#3B82F6" stroke-width="3"/>
  <text x="300" y="145" text-anchor="middle" fill="#3B82F6" font-family="Arial, sans-serif" font-size="16" font-weight="bold">HUMAN</text>
  <text x="300" y="165" text-anchor="middle" fill="#3B82F6" font-family="Arial, sans-serif" font-size="16" font-weight="bold">REVIEW</text>

  <path d="M350 150 H410" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="430" y="100" width="120" height="100" rx="8" fill="#1F2937" stroke="#E5E7EB" stroke-width="2"/>
  <text x="490" y="155" text-anchor="middle" fill="#E5E7EB" font-family="Arial, sans-serif" font-size="20" font-weight="bold">SHIP</text>
  <text x="490" y="180" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="12">Verified Code</text>

  <path d="M300 200 V250 H110 V200" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowRed)"/>
  <text x="205" y="240" text-anchor="middle" fill="#EF4444" font-family="Arial, sans-serif" font-size="14">REJECT / REVISE</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/>
    </marker>
  </defs>
</svg>
