<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="200" rx="10" fill="#1F2937"/>
  
  <rect x="30" y="50" width="150" height="100" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
  <text x="105" y="95" text-anchor="middle" fill="#3B82F6" font-family="Arial, sans-serif" font-size="18" font-weight="bold">VS Code</text>
  <text x="105" y="120" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="12">Editor/Interface</text>

  <path d="M180 100 H220" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="220" y="50" width="160" height="100" rx="8" fill="#111827" stroke="#10B981" stroke-width="2"/>
  <text x="300" y="95" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Opencode</text>
  <text x="300" y="120" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="12">Agentic Workflow</text>

  <path d="M380 100 H420" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="420" y="50" width="150" height="100" rx="8" fill="#111827" stroke="#10B981" stroke-width="2"/>
  <text x="495" y="95" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="18" font-weight="bold">DeepSeek V4</text>
  <text x="495" y="120" text-anchor="middle" fill="#E5E7EB" font-family="Arial, sans-serif" font-size="12">(Local/Free)</text>

  <defs>
