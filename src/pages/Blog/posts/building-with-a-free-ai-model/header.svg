
<!--?xml version="1.0" encoding="UTF-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0f172a"></stop>
            <stop offset="100%" stop-color="#020617"></stop>
        </linearGradient>

        <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#38bdf8"></stop>
            <stop offset="100%" stop-color="#8b5cf6"></stop>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
            <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
        </filter>

        <circle id="particle" r="4" fill="#38bdf8"></circle>
    </defs>

    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bg)"></rect>

    <!-- Grid -->
    <g opacity="0.05">
        <path d="M0 100H1200 M0 200H1200 M0 300H1200 M0 400H1200 M0 500H1200" stroke="white"></path>

        <path d="M100 0V630 M200 0V630 M300 0V630 M400 0V630 M500 0V630
                 M600 0V630 M700 0V630 M800 0V630 M900 0V630 M1000 0V630
                 M1100 0V630" stroke="white"></path>
    </g>

    <!-- Pipeline -->
    <path id="pipeline" d="M220 315 H420 H600 H780 H980" stroke="url(#flow)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.5"></path>

    <!-- Animated particles -->
    <use xlink:href="#particle">
        <animateMotion dur="4s" repeatCount="indefinite">
            <mpath xlink:href="#pipeline"></mpath>
        </animateMotion>
    </use>

    <use xlink:href="#particle" opacity="0.7">
        <animateMotion dur="4s" begin="1.3s" repeatCount="indefinite">
            <mpath xlink:href="#pipeline"></mpath>
        </animateMotion>
    </use>

    <use xlink:href="#particle" opacity="0.5">
        <animateMotion dur="4s" begin="2.6s" repeatCount="indefinite">
            <mpath xlink:href="#pipeline"></mpath>
        </animateMotion>
    </use>

    <!-- AI Node -->
    <g>
        <animateTransform attributeName="transform" type="translate" values="250 315;250 305;250 315" dur="4s" repeatCount="indefinite"></animateTransform>

        <circle r="70" fill="#111827" stroke="#38bdf8" stroke-width="3"></circle>

        <text x="0" y="-8" text-anchor="middle" fill="#38bdf8" font-size="28" font-family="monospace">
            AI
        </text>

        <text x="0" y="22" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="sans-serif">
            Free Model
        </text>
    </g>

    <!-- Code Node -->
    <g transform="translate(500 315)">
        <rect x="-80" y="-60" width="160" height="120" rx="18" fill="#111827" stroke="#8b5cf6" stroke-width="3"></rect>

        <text x="0" y="-10" text-anchor="middle" fill="#c4b5fd" font-size="20" font-family="monospace">
            &lt;/&gt;
        </text>

        <text x="0" y="22" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="sans-serif">
            Generated Code
        </text>
    </g>

    <!-- Human Node -->
    <g transform="translate(730 315)" filter="url(#glow)">
        <animateTransform attributeName="transform" additive="sum" type="scale" values="1;1.04;1" dur="3s" repeatCount="indefinite"></animateTransform>

        <circle r="80" fill="#0f172a" stroke="#22c55e" stroke-width="4"></circle>

        <circle cx="0" cy="-20" r="18" fill="#22c55e"></circle>

        <path d="M-28 28
               Q0 5 28 28
               L28 50
               L-28 50 Z" fill="#22c55e"></path>
    </g>

    <!-- Deploy Node -->
    <g transform="translate(980 315)">
        <rect x="-90" y="-55" width="180" height="110" rx="18" fill="#111827" stroke="#f59e0b" stroke-width="3"></rect>

        <text x="0" y="-8" text-anchor="middle" fill="#fbbf24" font-size="28" font-family="sans-serif">
            ✓
        </text>

        <text x="0" y="22" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="sans-serif">
            Human Approved
        </text>
    </g>

    <!-- Headline -->
    <text x="600" y="120" text-anchor="middle" fill="white" font-size="48" font-weight="700" font-family="Arial, sans-serif">
        Built With AI.
    </text>

    <text x="600" y="175" text-anchor="middle" fill="#38bdf8" font-size="48" font-weight="700" font-family="Arial, sans-serif">
        Shipped By Humans.
    </text>

    <!-- Footer -->
    <text x="600" y="540" text-anchor="middle" fill="#94a3b8" font-size="24" font-family="Arial, sans-serif">
        Free Model → Code → Human Judgment → Production
    </text>

</svg>
